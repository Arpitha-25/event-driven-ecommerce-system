# The whole system: PostgreSQL, Kafka, Kafka UI, the API gateway, identity-service and the three
# business services.
#
#   docker compose up -d --build                          # everything (first build takes a few minutes)
#   docker compose up -d postgres db-init kafka kafka-ui  # infrastructure only, to run services from the IDE / java -jar
#
# Clients use the gateway: http://localhost:8000. The services' own ports are also published so
# that development tools and the end-to-end scripts can reach them directly; in a real deployment
# only the gateway would be exposed.
#
# Inside this network, containers reach Kafka at kafka:29092 and Postgres at postgres:5432.
# From the host, use localhost:9092 and localhost:5432.

services:

  postgres:
    image: postgres:16
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates any missing service database on every start (init.sql above only runs for a new
  # volume), then exits. Services wait until it has finished successfully.
  db-init:
    image: postgres:16
    container_name: ecommerce-db-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./docker/postgres/init.sql:/init.sql:ro
    command: ["psql", "-h", "postgres", "-U", "postgres", "-v", "ON_ERROR_STOP=1", "-f", "/init.sql"]
    restart: "no"

  kafka:
    image: apache/kafka:3.8.0
    container_name: ecommerce-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ecommerce-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    image: ecommerce/api-gateway
    container_name: ecommerce-api-gateway
    depends_on:
      - identity-service
    ports:
      - "8000:8000"
    environment:
      IDENTITY_SERVICE_URL: http://identity-service:8084
      ORDER_SERVICE_URL: http://order-service:8080
      PRODUCT_SERVICE_URL: http://product-service:8082
      INVENTORY_SERVICE_URL: http://inventory-service:8083
    restart: on-failure

  identity-service:
    build:
      context: .
      dockerfile: identity-service/Dockerfile
    image: ecommerce/identity-service
    container_name: ecommerce-identity-service
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ecommerce_identity_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      # Development-only admin account, created at startup if missing. Change it outside local development.
      IDENTITY_ADMIN_EMAIL: admin@ecommerce.local
      IDENTITY_ADMIN_PASSWORD: admin12345
    restart: on-failure

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    image: ecommerce/order-service
    container_name: ecommerce-order-service
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    restart: on-failure

  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    image: ecommerce/product-service
    container_name: ecommerce-product-service
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ecommerce_product_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    restart: on-failure

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    image: ecommerce/inventory-service
    container_name: ecommerce-inventory-service
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ecommerce_inventory_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    restart: on-failure

volumes:
  postgres_data:
