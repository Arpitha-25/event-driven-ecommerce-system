name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit tests plus the Testcontainers integration tests (real PostgreSQL and Kafka;
      # Docker is available on GitHub's Ubuntu runners). Flyway builds every test database.
      - name: Build and test
        run: ./mvnw -B -ntp verify

      # Fails if any test was skipped (e.g. Testcontainers without Docker) or none ran.
      - name: Check test counts
        run: python3 .github/scripts/test-summary.py "Unit and integration tests"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/target/surefire-reports/'

  system-test:
    name: Full-flow system test (Docker images)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      # The module tests already ran in the build job; here only install the artifacts.
      - name: Install modules
        run: ./mvnw -B -ntp install -DskipTests

      # Builds the service images with docker compose, runs them with PostgreSQL and Kafka,
      # and drives the order saga through the REST APIs.
      - name: Build images and run the system test
        run: ./mvnw -B -ntp -Psystem-tests -pl system-tests verify

      - name: Check test counts
        run: python3 .github/scripts/test-summary.py "System test"

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: system-test-logs
          path: |
            system-tests/target/system-test-logs/
            system-tests/target/surefire-reports/
