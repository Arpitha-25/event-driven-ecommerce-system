server:
  port: 8082

spring:
  application:
    name: product-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce_product_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  flyway:
    # Adopt a database created before Flyway (by ddl-auto: update) as version 1 instead of failing.
    # V1 is identical to that schema, so nothing is re-created. An empty database runs V1 normally.
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      # The schema is owned by Flyway (db/migration); Hibernate only checks the entities match it.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  cache:
    # Product reads are cached in Redis (see CacheConfig). SPRING_CACHE_TYPE=none turns caching off.
    type: redis
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      # Short timeouts: if Redis is unavailable, reads fall back to PostgreSQL quickly.
      timeout: 500ms
      connect-timeout: 500ms

app:
  cache:
    product-ttl: 10m
  kafka:
    topics:
      product-created: product.created.v1
      product-updated: product.updated.v1
      product-deleted: product.deleted.v1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    redis:
      # The cache is optional: reads fall back to PostgreSQL, so a Redis outage must not
      # mark the whole service as down.
      enabled: false
