spring:
  application:
    name: order-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orderdb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  flyway:
    # Adopt a database created before Flyway (by ddl-auto: update) as version 1 instead of failing.
    # V1 is identical to that schema, so nothing is re-created. An empty database runs V1 normally.
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      # The schema is owned by Flyway (db/migration); Hibernate only checks the entities match it.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # No producer settings here: order events are sent by OutboxRelay using the
    # outboxKafkaTemplate in OutboxConfig, and dead letters by KafkaConfig's own producer.
    consumer:
      group-id: order-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Raw bytes; KafkaConfig's message converter maps the JSON to the listener's parameter type.
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      properties:
        # Topics are created by KafkaConfig with the right partition count, never implicitly by a consumer.
        allow.auto.create.topics: false

app:
  kafka:
    topics:
      order-created: order.created.v1
      order-updated: order.updated.v1
      order-cancelled: order.cancelled.v1
      inventory-reserved: inventory.reserved.v1
      inventory-reservation-failed: inventory.reservation-failed.v1
  idempotency:
    # Processed-event records older than this are deleted.
    retention-days: 7
  outbox:
    poll-interval-ms: 1000
    batch-size: 50
    send-timeout-ms: 10000
    retention-days: 7

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

info:
  app:
    name: Order Service
    description: Event Driven Order Management System using Spring Boot, Kafka and PostgreSQL
    version: 1.0.0
