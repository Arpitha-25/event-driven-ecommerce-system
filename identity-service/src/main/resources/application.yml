server:
  port: 8084

spring:
  application:
    name: identity-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce_identity_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      # The schema is owned by Flyway (db/migration); Hibernate only checks the entities match it.
      ddl-auto: validate
    show-sql: false

app:
  jwt:
    # Must match the gateway's app.security.jwt.issuer.
    issuer: ${JWT_ISSUER:ecommerce-identity-service}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:60m}
    # PEM files for a stable signing key. Leave empty to generate a key at startup
    # (fine for development; tokens then stop working when the service restarts).
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION:}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:}
  admin:
    # Creates this ADMIN account at startup if it doesn't exist. Leave empty to skip.
    email: ${IDENTITY_ADMIN_EMAIL:}
    password: ${IDENTITY_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
